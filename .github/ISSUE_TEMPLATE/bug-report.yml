name: Report a bug
description: Tell us what went wrong in the career workspace.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This report is PUBLIC. Do not include resumes, profile details, email contents, passwords, OAuth keys or pairing tokens. Crop and redact screenshots."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem without personal information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Jobs\n2. Select a filter\n3. Describe the result"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone, etc.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information and credentials from this public report.
          required: true
